# GreenQUIC V22 topology/runtime configuration for T20 (client), mode=plus.
# Power-policy values intentionally live in powermng.ini.
DeviceName=<SET_CLIENT_DPDK_DEVICE>
LocalIp=192.168.100.2
PeerMac=<SET_SERVER_LOCAL_MAC>
DpdkInitArgs=secnetperf -l 12 -a <SET_CLIENT_DPDK_DEVICE>
GreenQuicMode=plus
GreenQuicProfile=client_download
GreenQuicQuicProfile=max_throughput
GreenQuicDpdkLcores=12
GreenQuicEnableMultiCore=0
GreenQuicQuicWorkerCpus=20,21,22,23
GreenQuicPartitionDpdkMap=0:12,1:12,2:12,3:12
GreenQuicTxOwnerLcore=12
GreenQuicTxOwnerAlsoRx=1
GreenQuicEnableRx=1
GreenQuicEnableTx=1

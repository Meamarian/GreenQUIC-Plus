# GreenQUIC V22 topology/runtime configuration for T4_5 (server), mode=plus.
# Power-policy values intentionally live in powermng.ini.
DeviceName=<SET_SERVER_DPDK_DEVICE>
LocalIp=192.168.100.1
PeerMac=<SET_CLIENT_LOCAL_MAC>
DpdkInitArgs=secnetperf -l 8,9 -a <SET_SERVER_DPDK_DEVICE>
GreenQuicMode=plus
GreenQuicProfile=server_download
GreenQuicQuicProfile=max_throughput
GreenQuicDpdkLcores=8,9
GreenQuicEnableMultiCore=1
GreenQuicQuicWorkerCpus=16,17,18,19
GreenQuicPartitionDpdkMap=0:8,1:8,2:9,3:9
GreenQuicTxOwnerLcore=8
GreenQuicTxOwnerAlsoRx=1
GreenQuicEnableRx=1
GreenQuicEnableTx=1
